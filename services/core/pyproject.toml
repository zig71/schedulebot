[project]
name = "schedulebot-core"
version = "0.1.0"
description = "Pure scheduling engine for schedulebot: no I/O, deterministic, testable."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# The engine has no dependencies at all; these are for the service around it.
api = ["fastapi>=0.115", "uvicorn>=0.32", "argon2-cffi>=23.1", "httpx>=0.27"]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
]

[project.scripts]
schedulebot = "schedulebot_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schedulebot_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Depends() in an argument default is the FastAPI dependency-injection idiom;
# it is evaluated by the framework, not at import time.
"schedulebot_core/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
