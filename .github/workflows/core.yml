name: core

on:
  push:
    paths: ["services/core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["services/core/**", ".github/workflows/core.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      # A venv, not --system: the runner's Python is externally managed and
      # refuses system-wide installs.
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run mypy schedulebot_core
      # Pinned zone so date-sensitive tests do not depend on the runner's TZ.
      - run: uv run pytest
        env:
          TZ: Europe/London
